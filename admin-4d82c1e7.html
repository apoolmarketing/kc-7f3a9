<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"></head><body style="margin:0"><title>金融知識レベルチェック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 構成：スマホ向けの1カラム。上にタブ（受験／集計・分析）。受験は1問ずつ、集計は上から要約→分野→問題→個人の順。 */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --fg: #1b2230; --muted: #5b6678; --line: #d9dee7;
  --accent: #1f3864; --accent-soft: #e5ebf5; --on-accent: #ffffff;
  --good: #1f6b4b; --good-soft: #e1f1e9; --bad: #9c2f3f; --bad-soft: #f7e3e6; --warn: #8a5a00; --warn-soft: #fbf0d9;
  --font-display: "Zen Kaku Gothic New", "Noto Sans JP", "Hiragino Sans", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --surface: #19202a; --fg: #e8ebf0; --muted: #9aa5b5; --line: #2a3340;
  --accent: #9db8ea; --accent-soft: #222c40; --on-accent: #11151c;
  --good: #7cc8a2; --good-soft: #1b3328; --bad: #f09aa9; --bad-soft: #3a2027; --warn: #e5b85c; --warn-soft: #33290f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #19202a; --fg: #e8ebf0; --muted: #9aa5b5; --line: #2a3340;
  --accent: #9db8ea; --accent-soft: #222c40; --on-accent: #11151c;
  --good: #7cc8a2; --good-soft: #1b3328; --bad: #f09aa9; --bad-soft: #3a2027; --warn: #e5b85c; --warn-soft: #33290f; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  padding-block: 16px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.35; }
h1 { font-size: 22px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
p { margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); }
.tab { font: inherit; font-weight: 500; background: none; border: 0; padding: 10px 14px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=text], textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; }
textarea { min-height: 96px; resize: vertical; font-size: 13px; }
.btn { font: inherit; font-weight: 500; border-radius: 6px; padding: 10px 18px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .tab:focus-visible, .opt:focus-visible, .chip:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; gap: 8px; }
.seg label { position: relative; flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 10px; text-align: center; cursor: pointer; background: var(--bg); }
.seg input { position: absolute; opacity: 0; }
.seg input:checked + span { color: var(--accent); font-weight: 700; }
.seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
.ok { background: var(--good-soft); color: var(--good); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
.qtext { font-weight: 500; font-size: 16px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { font: inherit; text-align: left; display: flex; gap: 12px; align-items: flex-start; background: var(--bg); color: var(--fg); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; width: 100%; }
.opt .ol { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); text-align: center; line-height: 23px; font-size: 13px; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .ol { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.dot { font: inherit; font-size: 13px; padding: 6px 0; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
.dot.done { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.dot.cur { outline: 2px solid var(--accent); }
.score { font-family: var(--font-display); font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.kpi b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.brow { display: grid; grid-template-columns: 7.5em 1fr 6.5em; gap: 10px; align-items: center; font-size: 14px; }
.brow .num { text-align: right; font-variant-numeric: tabular-nums; }
.brow.weak .bar > i { background: var(--bad); }
.brow.strong .bar > i { background: var(--good); }
.wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; white-space: nowrap; }
td.n { text-align: right; white-space: nowrap; }
.pill { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.qi { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; background: var(--bg); border: 1px dashed var(--line); border-radius: 6px; padding: 10px; user-select: all; }
details > summary { cursor: pointer; color: var(--accent); }
.mut { color: var(--muted); font-size: 13px; }
[hidden] { display: none !important; }
@media (max-width: 480px) { .brow { grid-template-columns: 6em 1fr 5.5em; } .score { font-size: 38px; } }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .4s; } }
</style>

<div class="app">
  <header>
    <h1>金融知識レベルチェック</h1>
    <p class="sub">A-POOL　不動産20問＋その他金融10問（全30問・3択）</p>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-quiz" aria-selected="true">受験する</button>
    <button class="tab" role="tab" id="tab-admin" aria-selected="false">集計・分析（管理者）</button>
  </nav>
  <main id="view"></main>
</div>

<script>
